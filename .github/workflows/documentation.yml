name: Documentation

on:
  push:
    branches:
      - 'release/v*'

env:
  CAIDO_REF: ${{ github.ref }}
  CAIDO_GITHUB_TOKEN: ${{ github.token }}
  CAIDO_DOC_RW_TOKEN: ${{ secrets.CI__DOC__RW }}
  PR_BRANCH: bot-sdk-update
  VERSION_FILE: src/plugins/reference/caido-version.txt

permissions:
  contents: read

concurrency:
  group: documentation
  queue: max
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sdk-js
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: caido/sdk-js
          ref: ${{ env.CAIDO_REF }}
          path: ./sdk-js
          token: ${{ env.CAIDO_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Checkout doc-developer
        # zizmor: ignore[artipacked] the PR action requires authenticated Git operations in this checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: caido/doc-developer
          ref: main
          path: ./doc-developer
          token: ${{ env.CAIDO_DOC_RW_TOKEN }}

      - name: Check documented version
        id: version
        working-directory: ./doc-developer
        run: |
          version="$(jq -r .version ../sdk-js/packages/sdk-backend/package.json)"
          if [[ "$version" == *-* ]]; then
            echo "Skipping prerelease $version"
            exit 0
          fi

          # The PR branch gets force-pushed, so it must not hold newer docs either
          refs=(HEAD)
          if git ls-remote --exit-code --heads origin "$PR_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$PR_BRANCH"
            refs+=(FETCH_HEAD)
          fi

          for ref in "${refs[@]}"; do
            documented="$(git show "$ref:$VERSION_FILE" 2> /dev/null || true)"
            if [[ -n "$documented" ]] && ! printf '%s\n' "$documented" "$version" | sort -VC; then
              echo "Documentation on $ref is for $documented, newer than $version"
              exit 0
            fi
          done

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install Mise
        if: steps.version.outputs.version
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          working_directory: ./sdk-js
          version: ${{ vars.CI__MISE_VERSION }}
          experimental: true # Necessary for custom backend plugins

      - name: Install Mise
        if: steps.version.outputs.version
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          working_directory: ./doc-developer
          version: ${{ vars.CI__MISE_VERSION }}
          experimental: true # Necessary for custom backend plugins

      - name: Install dependencies
        if: steps.version.outputs.version
        working-directory: ./sdk-js
        run: pnpm install --frozen-lockfile

      - name: Run script
        if: steps.version.outputs.version
        working-directory: ./doc-developer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm generate:sdk
          printf '%s\n' "$VERSION" > "$VERSION_FILE"

      - name: Pull Request
        if: steps.version.outputs.version
        uses: caido/action-pull-request@bac6da8071ada152cce76cfbd24b54b7190ad799 # v6.0.1
        with:
          token: ${{ env.CAIDO_DOC_RW_TOKEN }}
          path: ./doc-developer
          commit-message: Update SDK Documentation for Caido v${{ steps.version.outputs.version }}
          committer: Caido Bot <dev@caido.io>
          author: Caido Bot <dev@caido.io>
          branch: ${{ env.PR_BRANCH }}
          delete-branch: true
          base: main
          title: Update SDK Documentation for Caido v${{ steps.version.outputs.version }}
          body: ''
