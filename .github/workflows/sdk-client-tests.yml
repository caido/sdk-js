name: SDK Client Tests

on:
  push:
    branches:
      - 'main'
    paths:
      - 'packages/sdk-client/**'
  pull_request:
    paths:
      - 'packages/sdk-client/**'

concurrency:
  group: sdk-client-tests-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-sdk-client:
    name: Test SDK Client (${{ matrix.caido-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        caido-version:
          - 0.56.0
          - 0.57.0
          - 0.58.0

    services:
      caido:
        image: caido/caido:${{ matrix.caido-version }}
        ports:
          - 8080:8080
        env:
          CAIDO_REGISTRATION_KEY: ${{ secrets.CAIDO_REGISTRATION_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}
          experimental: true # Necessary for custom backend plugins

      - name: Install dependencies
        run: pnpm install

      - name: Run sdk-client tests
        run: pnpm --filter @caido/sdk-client test
        env:
          CAIDO_PAT: ${{ secrets.CAIDO_PAT }}
          CAIDO_INSTANCE_URL: http://localhost:8080
