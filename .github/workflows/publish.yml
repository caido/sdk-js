name: Publish one independent SDK package

on:
  workflow_call:
    inputs:
      package:
        description: Independent package to publish
        required: true
        type: string
      ref:
        description: Immutable <package>-vX.Y.Z tag
        required: true
        type: string
      latest:
        description: Use latest instead of beta
        required: true
        type: boolean
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: false
      NPM_PUBLISH_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: sdk-registry-channels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable package tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify package and tag
        env:
          PACKAGE: ${{ inputs.package }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          case "$PACKAGE" in
            quickjs-types|sdk-shared|server-auth|sdk-client) ;;
            *) echo "Unsupported independent package: $PACKAGE" >&2; exit 1 ;;
          esac
          version="$(node -p "require('./packages/$PACKAGE/package.json').version")"
          test "$RELEASE_REF" = "$PACKAGE-v$version"
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_REF")"
          test -n "$tag_sha"
          test "$(git rev-parse HEAD)" = "$tag_sha"
          test -z "$(git branch --show-current)"

      - name: Install Mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}
          experimental: true # Necessary for custom backend plugins

      - name: Install lockfile-pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Build selected package graph
        env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm -r --if-present --filter "@caido/$PACKAGE..." build

      - name: Publish selected package
        env:
          PACKAGE: ${{ inputs.package }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing] GitHub Packages requires its own token
          publish() {
            local registry="$1" npmrc="${2:-}"
            local directory="packages/$PACKAGE"
            local name version tag
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            tag=beta
            if [[ "${{ inputs.latest }}" == "true" ]]; then tag=latest; fi
            if npm view "$name@$version" version --registry "$registry" >/dev/null 2>&1; then
              echo "$name@$version already exists at $registry; skipping"
              return
            fi
            if [[ -n "$npmrc" ]]; then
              NPM_TOKEN="$GITHUB_PACKAGES_TOKEN" NODE_AUTH_TOKEN="$GITHUB_PACKAGES_TOKEN" NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$directory" --access public --tag "$tag" --registry "$registry"
            else
              npm publish "$directory" --access public --tag "$tag" --registry "$registry"
            fi
          }

          publish https://registry.npmjs.org
          case "$PACKAGE" in
            quickjs-types|sdk-shared)
              publish https://npm.pkg.github.com "$GITHUB_WORKSPACE/.npmrc.github"
              ;;
          esac
