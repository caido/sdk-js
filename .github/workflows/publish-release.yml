name: Publish coupled SDK release

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable vX.Y.Z or vX.Y.Z-rc.N tag
        required: true
        type: string
      dry-run:
        description: Build packages without publishing
        required: true
        type: boolean
    secrets:
      GITHUB_PACKAGES_TOKEN:
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: sdk-registry-channels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: caido/sdk-js
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Select publication lane
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          if [[ "$RELEASE_REF" == *-rc.* ]]; then
            tag=beta
          else
            tag=latest
          fi
          printf 'NPM_DIST_TAG=%s\n' "$tag" >> "$GITHUB_ENV"

      - name: Install Mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}
          experimental: true # Necessary for custom backend plugins

      - name: Install lockfile-pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Build coupled packages
        run: pnpm -r --if-present --filter @caido/sdk-backend --filter @caido/sdk-frontend --filter @caido/sdk-workflow build

      - name: Publish coupled packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: | # zizmor: ignore[use-trusted-publishing] GitHub Packages mirror requires token authentication
          publish_public() {
            local package="$1" directory="packages/$1"
            local name version
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            if [[ "${{ inputs.dry-run }}" != "true" ]] && npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$version already exists on public npm; skipping"
              return
            fi
            local args=(--filter "$package" publish --access public --tag "$NPM_DIST_TAG")
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then args+=(--dry-run); fi
            pnpm "${args[@]}"
          }

          publish_internal() {
            local package="$1" directory="packages/$1"
            local name version
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            if [[ "${{ inputs.dry-run }}" != "true" ]] && NPM_TOKEN="$GITHUB_PACKAGES_TOKEN" NODE_AUTH_TOKEN="$GITHUB_PACKAGES_TOKEN" NPM_CONFIG_USERCONFIG="$GITHUB_WORKSPACE/.npmrc.github" npm view "$name@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "$name@$version already exists on GitHub Packages; skipping"
              return
            fi

            mv .npmrc .npmrc.pub
            mv .npmrc.github .npmrc
            restore_npmrc() {
              mv .npmrc .npmrc.github
              mv .npmrc.pub .npmrc
            }
            trap restore_npmrc RETURN
            local args=(--filter "$package" -r publish --tag "$NPM_DIST_TAG" --no-git-checks)
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then args+=(--dry-run); fi
            NPM_TOKEN="$GITHUB_PACKAGES_TOKEN" pnpm "${args[@]}"
            trap - RETURN
            restore_npmrc
          }

          publish_public sdk-backend
          publish_public sdk-frontend
          publish_public sdk-workflow
          publish_internal sdk-workflow
