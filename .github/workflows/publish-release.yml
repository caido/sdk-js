name: Publish coupled SDK release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable vX.Y.Z or vX.Y.Z-rc.N tag
        required: true
        type: string
      dry-run:
        description: Build and validate packages without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: sdk-registry-channels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable checkout
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          case "$RELEASE_REF" in
            v*-rc.*) internal=true ;;
            v*) internal=false ;;
            *) echo "Invalid release ref: $RELEASE_REF" >&2; exit 1 ;;
          esac
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_REF")"
          test -n "$tag_sha"
          test "$(git rev-parse HEAD)" = "$tag_sha"
          test -z "$(git branch --show-current)"
          printf 'INTERNAL_RELEASE=%s\n' "$internal" >> "$GITHUB_ENV"

      - name: Install Mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}
          experimental: true # Necessary for custom backend plugins

      - name: Install lockfile-pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Build coupled packages
        run: pnpm -r --if-present --filter @caido/sdk-backend --filter @caido/sdk-frontend --filter @caido/sdk-workflow build

      - name: Publish coupled packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true
        run: | # zizmor: ignore[use-trusted-publishing] RC publication targets GitHub Packages
          publish_public() {
            local package="$1" directory="packages/$1"
            local name version
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            if [[ "${{ inputs.dry-run }}" != "true" ]] && npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$version already exists on public npm; skipping"
              return
            fi
            local args=(--filter "$package" publish --access public --tag latest)
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then args+=(--dry-run); fi
            pnpm "${args[@]}"
          }

          publish_internal() {
            local package="$1" directory="packages/$1"
            local name version
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            if [[ "${{ inputs.dry-run }}" != "true" ]] && NPM_TOKEN="$GITHUB_PACKAGES_TOKEN" npm view "$name@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "$name@$version already exists on GitHub Packages; skipping"
              return
            fi

            mv .npmrc .npmrc.pub
            mv .npmrc.github .npmrc
            restore_npmrc() {
              mv .npmrc .npmrc.github
              mv .npmrc.pub .npmrc
            }
            trap restore_npmrc RETURN
            local args=(--filter "$package" -r publish --tag beta --no-git-checks)
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then args+=(--dry-run); fi
            NPM_TOKEN="$GITHUB_PACKAGES_TOKEN" pnpm "${args[@]}"
            trap - RETURN
            restore_npmrc
          }

          if [[ "$INTERNAL_RELEASE" == "true" ]]; then
            publish_internal sdk-backend
            publish_internal sdk-frontend
            publish_internal sdk-workflow
          else
            publish_public sdk-backend
            publish_public sdk-frontend
            publish_public sdk-workflow
            publish_internal sdk-workflow
          fi
