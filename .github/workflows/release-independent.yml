name: Release independent SDK package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Independent package to release
        required: true
        type: choice
        options:
          - quickjs-types
          - sdk-shared
          - server-auth
          - sdk-client
concurrency:
  group: sdk-independent-release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.preflight.outputs.ref }}
      sha: ${{ steps.preflight.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}
          experimental: true # Necessary for custom backend plugins

      - name: Validate release does not exist
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
          PACKAGE: ${{ inputs.package }}
        run: |
          version="$(node -p "require('./packages/$PACKAGE/package.json').version")"
          ref="$PACKAGE-v$version"
          name="@caido/$PACKAGE"

          if git show-ref --verify --quiet "refs/tags/$ref"; then
            echo "Git tag $ref already exists" >&2
            exit 1
          fi

          set +e
          output="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ref" 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "GitHub Release $ref already exists" >&2
            exit 1
          elif ! grep -Eq 'HTTP 404|Not Found' <<<"$output"; then
            echo "$output" >&2
            exit "$status"
          fi

          check_registry() {
            local registry="$1" npmrc="${2:-}"
            set +e
            if [[ -n "$npmrc" ]]; then
              output="$(NPM_TOKEN="$GITHUB_PACKAGES_TOKEN" NODE_AUTH_TOKEN="$GITHUB_PACKAGES_TOKEN" NPM_CONFIG_USERCONFIG="$npmrc" npm view "$name@$version" version --registry "$registry" 2>&1)"
            else
              output="$(npm view "$name@$version" version --registry "$registry" 2>&1)"
            fi
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              echo "$name@$version already exists at $registry" >&2
              exit 1
            elif ! grep -Eq '\bE404\b|\b404 Not Found\b' <<<"$output"; then
              echo "$output" >&2
              exit "$status"
            fi
          }

          check_registry https://registry.npmjs.org
          case "$PACKAGE" in
            quickjs-types|sdk-shared)
              check_registry https://npm.pkg.github.com "$GITHUB_WORKSPACE/.npmrc.github"
              ;;
          esac

          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - name: Checkout validated commit
        # zizmor: ignore[artipacked] this job creates the immutable tag and release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Create tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.validate.outputs.ref }}
        run: |
          git tag "$RELEASE_REF"
          git push origin "refs/tags/$RELEASE_REF"
          gh release create "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_REF" --verify-tag
          printf 'ref=%s\n' "$RELEASE_REF" >> "$GITHUB_OUTPUT"

  publish: # zizmor: ignore[self-repository] $/ is not yet accepted by actionlint v1.7.12
    needs: create
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      package: ${{ inputs.package }}
      ref: ${{ needs.create.outputs.ref }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
