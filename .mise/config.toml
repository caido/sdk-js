[plugins]
toolshed = "https://github.com/caido/mise-toolshed"

[tools]
node = "24.11.1"
pnpm = "11.28.0"
zizmor = "1.31.1"
"toolshed:get-skills" = "latest"

[settings]
minimum_release_age = "7d"

[tasks.typecheck]
description = "Run typecheck"
run = "pnpm typecheck"

[tasks.lint]
description = "Run linter"
run = "pnpm lint"

[tasks.knip]
description = "Run knip"
run = "pnpm knip"

[tasks.validate]
description = 'Validate the project'
depends = ['typecheck', 'lint', 'knip']
